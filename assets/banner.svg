<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: url(#titleGrad); }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(2deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-2deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    .floating-card-1 { animation: float1 6s ease-in-out infinite; }
    .floating-card-2 { animation: float2 8s ease-in-out infinite; }
    .bg-pulse { animation: pulseGlow 4s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Dynamic / Animated Background Orbs -->
  <circle cx="200" cy="80" r="140" fill="#6366f1" opacity="0.25" class="bg-pulse" filter="url(#glow)"/>
  <circle cx="1000" cy="220" r="160" fill="#a855f7" opacity="0.2" class="bg-pulse" filter="url(#glow)"/>

  <!-- Background Decorative Grid Lines -->
  <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 150,0 L 150,300 M 300,0 L 300,300 M 450,0 L 450,300 M 600,0 L 600,300 M 750,0 L 750,300 M 900,0 L 900,300 M 1050,0 L 1050,300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Dynamic Side Floating Elements (Kept safely on edges) -->
  <g class="floating-card-1">
    <rect x="50" y="50" width="160" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="70" y="80" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="14">⚡ Real-Time</text>
    <text x="70" y="100" fill="#cbd5e1" font-family="sans-serif" font-size="12">Co-Authoring</text>
  </g>

  <g class="floating-card-2">
    <rect x="980" y="180" width="170" height="70" rx="12" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <text x="1000" y="210" fill="#c084fc" font-family="sans-serif" font-weight="bold" font-size="14">🔒 Privacy First</text>
    <text x="1000" y="230" fill="#cbd5e1" font-family="sans-serif" font-size="12">E2E Encrypted</text>
  </g>

  <!-- Foreground Title and Subtitle Area (Guaranteed clear & legible) -->
  <g text-anchor="middle">
    <!-- Icon / Logo Graphic Above Title -->
    <g transform="translate(600, 65)">
      <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#818cf8" fill-opacity="0.2" stroke="#818cf8" stroke-width="2"/>
      <path d="M-10 -10 L10 -10 L10 12 L-10 12 Z M-6 -4 L6 -4 M-6 1 L4 1 M-6 6 L2 6" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Main Title -->
    <text x="600" y="150" class="title" text-anchor="middle">Awesome Word Processor</text>
    
    <!-- Subtitle -->
    <text x="600" y="190" class="subtitle" text-anchor="middle">Curated List of SaaS Platforms &amp; Open-Source Document Editors 📝</text>

    <!-- Pill Badges at Bottom Center -->
    <g transform="translate(390, 220)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="65" y="19" class="badge-text" text-anchor="middle">SaaS &amp; Cloud</text>
      
      <!-- Pill 2 -->
      <rect x="145" y="0" width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="210" y="19" class="badge-text" text-anchor="middle">Open-Source</text>
      
      <!-- Pill 3 -->
      <rect x="290" y="0" width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2"/>
      <text x="355" y="19" class="badge-text" text-anchor="middle">WYSIWYG SDKs</text>
    </g>
  </g>
</svg>
